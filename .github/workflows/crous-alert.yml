name: Alerte CROUS Luminy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency: crous-luminy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: crous-seen-${{ github.run_id }}
          restore-keys: crous-seen-
      - run: python crous_luminy_bot.py --once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: seen.json
          key: crous-seen-${{ github.run_id }}
